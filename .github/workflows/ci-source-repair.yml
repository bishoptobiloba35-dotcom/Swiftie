name: SwiftDrop CI source repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'ci: repair source type errors') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair source-level CI errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          driver = Path('apps/driver/App.tsx')
          text = driver.read_text()
          if 'styles.earnings' not in text:
              raise SystemExit('driver: expected styles.earnings reference was not found')
          text = text.replace('styles.earnings', 'styles.title')
          driver.write_text(text)

          customer = Path('apps/customer/App.tsx')
          text = customer.read_text()
          if 'delivery.dropoff.latitude' not in text or 'delivery.dropoff.longitude' not in text:
              raise SystemExit('customer: expected legacy flat dropoff coordinates were not found')
          text = text.replace('{location ? <View style={styles.locationBox}>', '{location && delivery.dropoff.location ? <View style={styles.locationBox}>')
          text = text.replace('delivery.dropoff.latitude', 'delivery.dropoff.location.latitude')
          text = text.replace('delivery.dropoff.longitude', 'delivery.dropoff.location.longitude')
          customer.write_text(text)
          PY

      - name: Commit and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ci-source-repair.yml
          git add apps/driver/App.tsx apps/customer/App.tsx
          git commit -m 'ci: repair source type errors'
          git push
