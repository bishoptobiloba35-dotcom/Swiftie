name: SwiftDrop CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: swiftdrop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [shared, api, admin, customer, driver]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build --workspace=@swiftdrop/${{ matrix.project }}

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swiftdrop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d swiftdrop_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swiftdrop_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test --workspace=@swiftdrop/api
