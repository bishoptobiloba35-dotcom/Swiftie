name: SwiftDrop CI
on:
  push:
    branches: [main]
  pull_request:
  
jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [api, customer, driver, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build --workspace=@swiftdrop/${{ matrix.project }}
