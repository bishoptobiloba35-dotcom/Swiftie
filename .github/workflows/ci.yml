name: SwiftDrop CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: swiftdrop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [shared, api, admin, customer, driver]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build --workspace=@swiftdrop/${{ matrix.project }}
      - name: Validate Expo production configuration
        if: matrix.project == 'customer' || matrix.project == 'driver'
        working-directory: apps/${{ matrix.project }}
        env:
          GOOGLE_MAPS_API_KEY: ci-validation-placeholder
        run: npx expo config --type public --json

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test --workspace=@swiftdrop/api
