name: Deploy SwiftDrop API to production

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: swiftdrop-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Check out the manually selected commit
        uses: actions/checkout@v5

      - name: Require successful staging deployment of this exact SHA within 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?branch=main&status=success&per_page=50")"
          now="$(date -u +%s)"
          matched=false
          while IFS=$'\t' read -r created_at head_sha conclusion; do
            [ -n "$created_at" ] || continue
            created_epoch="$(date -u -d "$created_at" +%s)"
            age=$((now - created_epoch))
            if [ "$conclusion" = "success" ] && [ "$head_sha" = "$SELECTED_SHA" ] && [ "$age" -ge 0 ] && [ "$age" -le 86400 ]; then
              matched=true
              break
            fi
          done < <(jq -r '.workflow_runs[] | [.created_at, .head_sha, .conclusion] | @tsv' <<< "$response")
          if [ "$matched" != true ]; then
            echo "::error::No successful staging deployment for SHA $SELECTED_SHA was found in the previous 24 hours."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply production database migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::PRODUCTION_DATABASE_URL is required"; exit 1; }
          npm run migrate --workspace=@swiftdrop/api
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT id, applied_at FROM schema_migrations ORDER BY id"

      - name: Deploy API to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_PRODUCTION_SERVICE_ID: ${{ vars.RAILWAY_PRODUCTION_SERVICE_ID }}
        run: |
          set -euo pipefail
          test -n "$RAILWAY_TOKEN" || { echo "::error::RAILWAY_TOKEN is required"; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "::error::RAILWAY_PROJECT_ID is required"; exit 1; }
          test -n "$RAILWAY_PRODUCTION_SERVICE_ID" || { echo "::error::RAILWAY_PRODUCTION_SERVICE_ID is required"; exit 1; }
          npm install --global @railway/cli
          railway up --ci --project "$RAILWAY_PROJECT_ID" --environment production --service "$RAILWAY_PRODUCTION_SERVICE_ID"

      - name: Verify production health (30-second request timeout)
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_API_URL" || { echo "::error::PRODUCTION_API_URL is required"; exit 1; }
          curl --fail --silent --show-error --max-time 30 "${PRODUCTION_API_URL%/}/health"

      - name: Notify Slack with status and SHA
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$SLACK_WEBHOOK_URL" || { echo "::error::SLACK_WEBHOOK_URL is required for deployment notifications"; exit 1; }
          payload="$(jq -n --arg status "$JOB_STATUS" --arg sha "$DEPLOY_SHA" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{text: ("SwiftDrop production deploy " + $status + " · SHA " + $sha + " · " + $url)}')"
          curl --fail --silent --show-error --max-time 15 -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"
