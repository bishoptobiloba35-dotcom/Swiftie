services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: swiftdrop
      POSTGRES_PASSWORD: swiftdrop_dev
      POSTGRES_DB: swiftdrop
    volumes:
      - swiftdrop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftdrop -d swiftdrop"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    image: node:22-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /work
    environment:
      DATABASE_URL: postgresql://swiftdrop:swiftdrop_dev@db:5432/swiftdrop
      REPO_DIR: /repo
    volumes:
      - .:/repo:ro
      - /tmp/swiftdrop:/seed:ro
      - swiftdrop_init_work:/work
    command: ["sh", "-ec", "npm init -y >/dev/null && npm install pg@^8.16.3 && cp /seed/seed.mjs /work/seed.mjs && node /work/seed.mjs"]

  api:
    image: node:22-alpine
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    working_dir: /app
    environment:
      NODE_ENV: development
      API_PORT: "4000"
      DATABASE_URL: postgresql://swiftdrop:swiftdrop_dev@db:5432/swiftdrop
      CORS_ORIGINS: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      JWT_EXPIRES_IN: 7d
      PAYMENT_PROVIDER: paystack
      DRIVER_PAYOUT_PERCENT: "90"
      MAPS_PROVIDER: google
      LOCAL_PRIVATE_STORAGE_DIR: /var/lib/swiftdrop/uploads
    env_file:
      - /run/base44/app.env
    volumes:
      - .:/app
      - swiftdrop_uploads:/var/lib/swiftdrop/uploads
    ports:
      - "8000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    command: ["sh", "-ec", "npm install && cd services/api && exec /app/node_modules/.bin/tsx watch src/server.ts"]

  web:
    image: node:22-alpine
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    working_dir: /app
    environment:
      VITE_API_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    volumes:
      - .:/app
    ports:
      - "3000:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    command: ["sh", "-ec", "npm install && cd apps/admin && exec /app/node_modules/.bin/vite --host 0.0.0.0 --port 5173"]

volumes:
  swiftdrop_pgdata:
  swiftdrop_uploads:
  swiftdrop_init_work:
